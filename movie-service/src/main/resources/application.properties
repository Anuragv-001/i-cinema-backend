spring.application.name=movie-service

server.port=${PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/icinema_movie}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.non-secure-port-enabled=${EUREKA_INSTANCE_NON_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port-enabled=${EUREKA_INSTANCE_SECURE_PORT_ENABLED:true}
eureka.instance.secure-port=${EUREKA_INSTANCE_SECURE_PORT:443}